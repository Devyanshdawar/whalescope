services:
  whalescope:
    build:
      context: .
      dockerfile: Dockerfile
    image: whalescope-intelligence:latest
    container_name: whalescope_dashboard
    restart: always
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

